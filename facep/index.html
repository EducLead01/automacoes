<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FACEP | Automação e CRM de Captação</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #0A0A0A; color: #fff; }

    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      section { break-inside: avoid; }
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0A0A0A; }
    ::-webkit-scrollbar-thumb { background: #E79E14; border-radius: 2px; }

    .el-yellow { color: #E79E14; }
    .bg-el-yellow { background: #E79E14; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.6s ease both; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }

    .unit-card {
      background: #111111;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
    }
    .unit-card:hover {
      border-color: rgba(231,158,20,0.4);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .btn-cta {
      background: #E79E14;
      color: #0A0A0A;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-radius: 10px;
      padding: 16px 32px;
      display: inline-block;
      text-align: center;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-cta:hover {
      background: #fbbf24;
      transform: scale(1.02);
    }
    .btn-cta:active { transform: scale(0.98); }

    .number-badge {
      width: 36px;
      height: 36px;
      background: rgba(231,158,20,0.12);
      border: 1px solid rgba(231,158,20,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      color: #E79E14;
      flex-shrink: 0;
    }

    /* Checklist da calculadora */
    .module-row {
      background: #111111;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer;
    }
    .module-row:hover { border-color: rgba(231,158,20,0.3); }
    .module-row.checked {
      border-color: rgba(231,158,20,0.5);
      background: rgba(231,158,20,0.06);
    }
    .module-row input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: #E79E14;
      flex-shrink: 0;
      cursor: pointer;
    }
    #flywheel > div {
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #calc-bar {
      position: sticky;
      bottom: 0;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(231,158,20,0.25);
    }

  </style>
</head>
<body>

  <div id="page-content">
  <div data-module="/facep/sections/capa.html"></div>
  <div data-module="/facep/sections/entregaveis.html"></div>
  <div data-module="/facep/sections/proximos-passos.html"></div>
  </div>

  <script>
    function loadModules() {
      const modules = document.querySelectorAll('[data-module]');
      let pending = modules.length;
      modules.forEach(async (el) => {
        const res = await fetch(el.dataset.module);
        el.outerHTML = await res.text();
        pending -= 1;
        if (pending === 0) {
          if (typeof initCalculadora === 'function') initCalculadora();
          if (typeof initFlywheel === 'function') initFlywheel();
        }
      });
    }

    loadModules();

    /* Entregáveis — soma dinâmica por categoria (único / anual / mensal) */
    function formatBRL(v) {
      return v.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function recalcTotal() {
      const boxes = document.querySelectorAll('.module-check');
      let once = 0, annual = 0, monthly = 0;
      boxes.forEach((box) => {
        const row = box.closest('.module-row');
        if (box.checked) {
          once += Number(box.dataset.once || 0);
          annual += Number(box.dataset.annual || 0);
          monthly += Number(box.dataset.monthly || 0);
          row.classList.add('checked');
        } else {
          row.classList.remove('checked');
        }
      });
      const onceEl = document.getElementById('calc-once');
      const annualEl = document.getElementById('calc-annual');
      const monthlyEl = document.getElementById('calc-monthly');
      if (onceEl) onceEl.textContent = 'R$ ' + formatBRL(once);
      if (annualEl) annualEl.textContent = 'R$ ' + formatBRL(annual);
      if (monthlyEl) monthlyEl.textContent = 'R$ ' + formatBRL(monthly);
    }

    function initCalculadora() {
      document.querySelectorAll('.module-check').forEach((box) => {
        box.addEventListener('change', recalcTotal);
      });
      recalcTotal();
    }

    /* Flywheel — Meta Ads → TikTok Ads → Servidor (IA) → Kommo → devolução */
    function initFlywheel() {
      const svg = document.getElementById('flywheel-svg');
      const wheel = document.getElementById('flywheel');
      const captionEl = document.getElementById('flow-caption');
      if (!svg || !wheel || !captionEl) return;

      const cx = 150, cy = 150, rOuter = 140, rInner = 85, rLabel = 166;

      function polar(r, angleDeg) {
        const theta = (angleDeg - 90) * Math.PI / 180;
        return { x: cx + r * Math.cos(theta), y: cy + r * Math.sin(theta) };
      }

      function arcPath(startAngle, endAngle) {
        const so = polar(rOuter, startAngle);
        const eo = polar(rOuter, endAngle);
        const si = polar(rInner, startAngle);
        const ei = polar(rInner, endAngle);
        const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
        return 'M ' + so.x + ' ' + so.y +
          ' A ' + rOuter + ' ' + rOuter + ' 0 ' + largeArc + ' 1 ' + eo.x + ' ' + eo.y +
          ' L ' + ei.x + ' ' + ei.y +
          ' A ' + rInner + ' ' + rInner + ' 0 ' + largeArc + ' 0 ' + si.x + ' ' + si.y + ' Z';
      }

      const segments = [
        { id: 'meta', label: 'Meta Ads', color: '#1877F2', start: 3, end: 87 },
        { id: 'tiktok', label: 'TikTok Ads', color: '#FE2C55', start: 93, end: 177 },
        { id: 'servidor', label: 'Servidor (IA)', color: '#E79E14', start: 183, end: 267 },
        { id: 'kommo', label: 'Kommo', color: '#A855F7', start: 273, end: 357 },
      ];

      const ns = 'http://www.w3.org/2000/svg';
      segments.forEach((seg) => {
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', arcPath(seg.start, seg.end));
        path.setAttribute('fill', seg.color);
        path.setAttribute('fill-opacity', '0.55');
        path.setAttribute('id', 'seg-' + seg.id);
        path.style.transition = 'fill-opacity 0.4s ease, filter 0.4s ease';
        svg.appendChild(path);

        const mid = (seg.start + seg.end) / 2;
        const pos = polar(rLabel, mid);
        const label = document.createElement('div');
        label.id = 'label-' + seg.id;
        label.className = 'absolute text-center font-black text-[11px] uppercase tracking-wide';
        label.style.left = (pos.x / 300 * 100) + '%';
        label.style.top = (pos.y / 300 * 100) + '%';
        label.style.transform = 'translate(-50%, -50%) scale(1)';
        label.style.width = '26%';
        label.style.color = seg.color;
        label.style.opacity = '0.6';
        label.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        label.textContent = seg.label;
        wheel.appendChild(label);
      });

      const captions = {
        meta: 'Meta Ads envia o lead pro funil',
        tiktok: 'TikTok Ads envia o lead pro funil',
        servidor: 'Servidor de Atribuição captura o evento — server-side, feito pra IA',
        kommo: 'Kommo CRM registra a matrícula',
        devolucao: '↺ Devolução: sinal de matrícula volta pro Meta Ads e pro TikTok Ads',
      };
      const order = ['meta', 'tiktok', 'servidor', 'kommo', 'devolucao'];

      let i = 0;
      function tick() {
        const key = order[i % order.length];
        segments.forEach((seg) => {
          const path = document.getElementById('seg-' + seg.id);
          const label = document.getElementById('label-' + seg.id);
          const active = seg.id === key || (key === 'devolucao' && (seg.id === 'meta' || seg.id === 'tiktok'));
          if (path) {
            path.setAttribute('fill-opacity', active ? '1' : '0.55');
            path.style.filter = active ? 'drop-shadow(0 0 8px ' + seg.color + ')' : 'none';
          }
          if (label) {
            label.style.opacity = active ? '1' : '0.6';
            label.style.transform = 'translate(-50%, -50%) scale(' + (active ? 1.1 : 1) + ')';
          }
        });
        captionEl.style.opacity = '0';
        setTimeout(() => {
          captionEl.textContent = captions[key];
          captionEl.style.opacity = '1';
        }, 200);
        i += 1;
      }
      tick();
      setInterval(tick, 2200);
    }
  </script>

</body>
</html>
