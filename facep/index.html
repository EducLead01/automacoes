<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FACEP | Automação e CRM de Captação</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #0A0A0A; color: #fff; }

    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      section { break-inside: avoid; }
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0A0A0A; }
    ::-webkit-scrollbar-thumb { background: #E79E14; border-radius: 2px; }

    .el-yellow { color: #E79E14; }
    .bg-el-yellow { background: #E79E14; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.6s ease both; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }

    .unit-card {
      background: #111111;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 24px;
      transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
    }
    .unit-card:hover {
      border-color: rgba(231,158,20,0.4);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .btn-cta {
      background: #E79E14;
      color: #0A0A0A;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-radius: 10px;
      padding: 16px 32px;
      display: inline-block;
      text-align: center;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-cta:hover {
      background: #fbbf24;
      transform: scale(1.02);
    }
    .btn-cta:active { transform: scale(0.98); }

    .number-badge {
      width: 36px;
      height: 36px;
      background: rgba(231,158,20,0.12);
      border: 1px solid rgba(231,158,20,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      color: #E79E14;
      flex-shrink: 0;
    }

    /* Checklist da calculadora */
    .module-row {
      background: #111111;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer;
    }
    .module-row:hover { border-color: rgba(231,158,20,0.3); }
    .module-row.checked {
      border-color: rgba(231,158,20,0.5);
      background: rgba(231,158,20,0.06);
    }
    .module-row input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: #E79E14;
      flex-shrink: 0;
      cursor: pointer;
    }
    #calc-bar {
      position: sticky;
      bottom: 0;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(231,158,20,0.25);
    }

  </style>
</head>
<body>

  <div id="page-content">
  <div data-module="sections/capa.html"></div>
  <div data-module="sections/entregaveis.html"></div>
  <div data-module="sections/proximos-passos.html"></div>
  </div>

  <script>
    function loadModules() {
      const modules = document.querySelectorAll('[data-module]');
      let pending = modules.length;
      modules.forEach(async (el) => {
        const res = await fetch(el.dataset.module);
        el.outerHTML = await res.text();
        pending -= 1;
        if (pending === 0 && typeof initCalculadora === 'function') initCalculadora();
      });
    }

    loadModules();

    /* Entregáveis — soma dinâmica por categoria (único / anual / mensal) */
    function formatBRL(v) {
      return v.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function recalcTotal() {
      const boxes = document.querySelectorAll('.module-check');
      let once = 0, annual = 0, monthly = 0;
      boxes.forEach((box) => {
        const row = box.closest('.module-row');
        if (box.checked) {
          once += Number(box.dataset.once || 0);
          annual += Number(box.dataset.annual || 0);
          monthly += Number(box.dataset.monthly || 0);
          row.classList.add('checked');
        } else {
          row.classList.remove('checked');
        }
      });
      const onceEl = document.getElementById('calc-once');
      const annualEl = document.getElementById('calc-annual');
      const monthlyEl = document.getElementById('calc-monthly');
      if (onceEl) onceEl.textContent = 'R$ ' + formatBRL(once);
      if (annualEl) annualEl.textContent = 'R$ ' + formatBRL(annual);
      if (monthlyEl) monthlyEl.textContent = 'R$ ' + formatBRL(monthly);
    }

    function initCalculadora() {
      document.querySelectorAll('.module-check').forEach((box) => {
        box.addEventListener('change', recalcTotal);
      });
      recalcTotal();
    }
  </script>

</body>
</html>
