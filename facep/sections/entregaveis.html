<!-- ENTREGÁVEIS -->
<section style="background:#0D0D0D; border-top:1px solid rgba(255,255,255,0.05);" class="px-6 py-20">
  <div class="mx-auto" style="max-width:760px;">

    <div class="text-center mb-10">
      <p class="text-xs font-black uppercase tracking-[0.35em] el-yellow mb-3">Proposta FACEP</p>
      <h2 class="font-black uppercase tracking-tight text-3xl sm:text-4xl">Entregáveis</h2>
    </div>

    <div class="flex flex-col gap-3">

      <!-- 1. HOSPEDAGEM ANUAL -->
      <label class="module-row p-5 flex gap-4 items-start text-left">
        <input type="checkbox" class="module-check mt-1" data-annual="350" />
        <div class="flex-1">
          <div class="flex items-start justify-between gap-3">
            <h3 class="font-black uppercase tracking-tight text-sm">Hospedagem Anual</h3>
            <p class="font-black text-sm whitespace-nowrap" style="color:#E79E14;">R$ 350<span class="text-xs text-white/30 font-normal">/ano</span></p>
          </div>
          <p class="text-white/50 text-sm leading-relaxed mt-1">Hospedagem da página institucional e das landing pages, com renovação anual.</p>
        </div>
      </label>

      <!-- 2. TIKTOK ADS -->
      <label class="module-row p-5 flex gap-4 items-start text-left">
        <input type="checkbox" class="module-check mt-1" />
        <div class="flex-1">
          <div class="flex items-start justify-between gap-3">
            <h3 class="font-black uppercase tracking-tight text-sm">Gestão de TikTok Ads</h3>
            <p class="font-black text-sm whitespace-nowrap text-white/40">Incluso</p>
          </div>
          <p class="text-white/50 text-sm leading-relaxed mt-1">Já faz parte do plano vigente com a Educ Lead — sem custo adicional.</p>
        </div>
      </label>

      <!-- 3. SERVIDOR DE ATRIBUIÇÃO -->
      <label class="module-row p-6 flex gap-4 items-start text-left" style="border-color: rgba(231,158,20,0.3);">
        <input type="checkbox" class="module-check mt-1" data-once="600" data-monthly="297" />
        <div class="flex-1">
          <div class="flex items-start justify-between gap-3 flex-wrap">
            <h3 class="font-black uppercase tracking-tight text-sm el-yellow">Servidor de Atribuição — Feito pra IA</h3>
            <div class="text-right whitespace-nowrap">
              <p class="font-black text-sm" style="color:#E79E14;">R$ 600 <span class="text-white/30 font-normal">setup</span></p>
              <p class="font-black text-sm" style="color:#E79E14;">R$ 297<span class="text-xs text-white/30 font-normal">/mês</span></p>
            </div>
          </div>
          <p class="el-yellow text-[11px] font-black uppercase tracking-[0.25em] mt-4 mb-1">O que mudou na plataforma</p>
          <p class="text-white/60 text-sm leading-relaxed">
            Desde que iOS e navegadores passaram a bloquear cookie por padrão, todo pixel de
            navegador — de qualquer anunciante, em qualquer setor — perdeu parte do que enxerga.
            E o leilão que recebe esse dado incompleto não é mais operado por humano: hoje quem
            decide onde cada real de mídia aparece é uma IA (o <strong class="text-white/80">Meta Andrômeda</strong>),
            que aprende padrão a cada evento recebido. Sinal fraco entra, decisão fraca sai.
          </p>

          <p class="el-yellow text-[11px] font-black uppercase tracking-[0.25em] mt-4 mb-2">O mecanismo</p>
          <div class="flex flex-wrap gap-2 mb-3">
            <span class="text-[11px] font-black uppercase tracking-wide px-3 py-1 rounded-full" style="background: rgba(231,158,20,0.12); border:1px solid rgba(231,158,20,0.3); color:#E79E14;">Direto do servidor</span>
            <span class="text-[11px] font-black uppercase tracking-wide px-3 py-1 rounded-full" style="background: rgba(231,158,20,0.12); border:1px solid rgba(231,158,20,0.3); color:#E79E14;">Não depende de cookie</span>
            <span class="text-[11px] font-black uppercase tracking-wide px-3 py-1 rounded-full" style="background: rgba(231,158,20,0.12); border:1px solid rgba(231,158,20,0.3); color:#E79E14;">Igual no iOS</span>
          </div>
          <p class="text-white/60 text-sm leading-relaxed">
            O Servidor de Atribuição fecha essa lacuna com um túnel de dados privado — servidor a
            servidor, sem passar pelo navegador do candidato. Cada evento real do funil — mensagem
            respondida, lead qualificado, matrícula fechada no <strong class="text-white/80">Kommo CRM</strong>
            — chega até a IA do Meta via CAPI no exato instante em que acontece.
          </p>

          <!-- Diagrama visual (flywheel) -->
          <div class="relative mx-auto my-6" id="flywheel" style="width:min(300px, 92%); aspect-ratio: 1 / 1;">
            <svg id="flywheel-svg" viewBox="0 0 300 300" style="position:absolute; top:0; left:0; width:100%; height:100%;"></svg>
            <div class="absolute rounded-full flex items-center justify-center text-center" style="width:56.7%; height:56.7%; left:21.7%; top:21.7%; background:#151515; border:2px solid rgba(231,158,20,0.5);">
              <p class="font-black text-xs uppercase tracking-wide leading-tight text-white">Matrícula</p>
            </div>
          </div>
          <p id="flow-caption" class="text-center text-white/50 text-xs h-8 flex items-center justify-center transition-opacity duration-300">Meta Ads envia o lead pro funil</p>

          <p class="el-yellow text-[11px] font-black uppercase tracking-[0.25em] mt-4 mb-1">Por que agora</p>
          <p class="text-white/60 text-sm leading-relaxed">
            Isso não é exclusividade da FACEP — é pra onde o mercado inteiro está indo. Instituições
            que já alimentam a IA do Meta com sinal server-side treinam o algoritmo a favor delas a
            cada matrícula fechada, e tendem a ganhar lance mais barato no mesmo leilão. Quem
            demora a entrar nessa corrida compete, cada dia mais, com menos munição que o concorrente
            do lado.
          </p>

          <p class="el-yellow text-[11px] font-black uppercase tracking-[0.25em] mt-4 mb-1">A transformação</p>
          <p class="text-white/80 text-sm leading-relaxed font-semibold">
            Mesma verba, mesma campanha — só que agora o algoritmo aprende com
            <span class="el-yellow">quem matricula</span>, não só com quem clica. Cada real investido
            passa a mirar mais perto do aluno real.
          </p>
        </div>
      </label>

      <!-- 4. LANDING PAGES -->
      <label class="module-row p-5 flex gap-4 items-start text-left">
        <input type="checkbox" class="module-check mt-1" data-once="1500" />
        <div class="flex-1">
          <div class="flex items-start justify-between gap-3">
            <h3 class="font-black uppercase tracking-tight text-sm">3 Mini Landing Pages + Integração</h3>
            <p class="font-black text-sm whitespace-nowrap" style="color:#E79E14;">R$ 1.500</p>
          </div>
          <p class="text-white/50 text-sm leading-relaxed mt-1">
            TEC NEC, Técnico em Enfermagem e FACEP institucional — até 4 dobras cada, com
            rastreamento avançado, botão de WhatsApp via Meta CAPI, integração da página, webhook e API.
          </p>
        </div>
      </label>

    </div>
  </div>

  <!-- BARRA DE TOTAL -->
  <div id="calc-bar" class="mt-10 px-6 py-5">
    <div class="mx-auto flex items-center justify-between gap-6 flex-wrap" style="max-width:760px;">
      <div>
        <p class="text-[10px] font-black uppercase tracking-[0.3em] text-white/40">Único</p>
        <p id="calc-once" class="font-black text-xl">R$ 0</p>
      </div>
      <div>
        <p class="text-[10px] font-black uppercase tracking-[0.3em] text-white/40">Anual</p>
        <p id="calc-annual" class="font-black text-xl">R$ 0</p>
      </div>
      <div>
        <p class="text-[10px] font-black uppercase tracking-[0.3em] text-white/40">Mensal</p>
        <p id="calc-monthly" class="font-black text-2xl sm:text-3xl" style="color:#E79E14;">R$ 0</p>
      </div>
    </div>
  </div>
</section>
